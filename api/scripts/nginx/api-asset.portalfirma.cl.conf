# API de PortalFirma Asset (NestJS en 127.0.0.1:4570) en su dominio definitivo. Convive con asset.matchoncard.cl,
# que sigue activo mientras haya equipos con la versión anterior de la app y enlaces ya enviados con ese dominio.
# Se instala con api/scripts/dominio-nuevo.sh (copia este archivo a /etc/nginx/sites-enabled/ y pide el certificado).

# HTTP: Let's Encrypt y redirección a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api-asset.portalfirma.cl;

    access_log /var/log/nginx/asset-api-pf.access.log;

    include snippets/matchoncard-acme.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api-asset.portalfirma.cl;

    ssl_certificate /etc/letsencrypt/live/api-asset.portalfirma.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-asset.portalfirma.cl/privkey.pem;
    include snippets/matchoncard-ssl.conf;

    access_log /var/log/nginx/asset-api-pf.access.log;
    error_log /var/log/nginx/asset-api-pf.error.log warn;

    # documentos para Portalfirma en base64 (la API acepta hasta 30 MB en /v1/portalfirma/herramientas)
    client_max_body_size 32m;

    location = / {
        return 404;
    }

    # los feeds de los portales (/v1/feeds/<clave>/<portal>.xml) también pasan por aquí
    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:4570;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # se reemplaza (no se agrega): la API confía en un solo salto (trust proxy 1)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 150s;
        proxy_read_timeout 150s;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        return 404;
    }
}
